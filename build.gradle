apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]
sourceSets.test.java.srcDirs = ["test"]

//The acceptance harness is a second Mindustry mod that drives the inspector inside a real client.
//Keeping it in its own source set is what guarantees it can never reach the release artifact, which is
//built from sourceSets.main alone.
sourceSets{
    acceptance{
        java.srcDirs = ["acceptance/src"]
        compileClasspath += sourceSets.main.output
    }
}

ext{
    //pinned stable Mindustry release; the game API is not stable across major builds, so avoid "latest"/"be" here
    mindustryVersion = "v159.7"
    junitVersion = "5.11.4"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories{
    mavenCentral()

    //Mindustry publishes a fat "dependencies.jar" on every release; this ivy layout pulls that file directly.
    //It is the approach used by the official mod template and is more reliable than jitpack.
    ivy{
        url = "https://github.com/"
        patternLayout{
            artifact("/[organisation]/[module]/releases/download/[revision]/dependencies.jar")
        }
        metadataSources{ artifact() }
        content{ includeVersion("Anuken", "Mindustry", mindustryVersion) }
    }

    //the same release also ships the game assets; the headless integration tests need them to boot
    ivy{
        url = "https://github.com/"
        patternLayout{
            artifact("/Anuken/Mindustry/releases/download/[revision]/assets.jar")
        }
        metadataSources{ artifact() }
        content{ includeModule("Anuken", "MindustryAssets") }
    }
}

java{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations{
    //game assets, needed only by the headless integration tests
    mindustryAssets
}

dependencies{
    //compileOnly: the game already provides Mindustry and Arc at runtime, they must never be bundled into the mod jar
    compileOnly "Anuken:Mindustry:$mindustryVersion"

    acceptanceCompileOnly "Anuken:Mindustry:$mindustryVersion"

    testImplementation "Anuken:Mindustry:$mindustryVersion"
    mindustryAssets "Anuken:MindustryAssets:$mindustryVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

//Mindustry resolves its internal files from the classpath root, but the release archive nests them under
//"assets/", so the archive is unpacked and that inner folder is what goes on the test classpath.
def mindustryAssetsDir = layout.buildDirectory.dir("mindustry-assets")

tasks.register("extractMindustryAssets", Copy){
    from{ zipTree(configurations.mindustryAssets.singleFile) }
    into mindustryAssetsDir
    //sprites, sounds and music are never touched in headless mode and make up most of the archive
    exclude "assets/sprites/**", "assets/sounds/**", "assets/music/**"
}

tasks.named("test"){
    dependsOn "extractMindustryAssets"
    classpath += files(mindustryAssetsDir.map{ it.dir("assets") })
    //the benchmark is a measurement, not a check; it would only make an ordinary test run slower
    useJUnitPlatform{ excludeTags "benchmark" }
    testLogging{
        events = ["failed"]
        exceptionFormat = "full"
    }
}

//prints what an area analysis costs at several sizes; see docs/testing.md
tasks.register("areaBenchmark", Test){
    group = "verification"
    description = "Measures the cost of area analysis at 50, 250, 1000 and 4000 buildings."
    dependsOn "extractMindustryAssets"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(mindustryAssetsDir.map{ it.dir("assets") })
    useJUnitPlatform{ includeTags "benchmark" }
    //the measurements are the whole point of the task, so they go to the console rather than a report
    testLogging{
        showStandardStreams = true
        events = ["failed", "standard_out"]
        exceptionFormat = "full"
    }
    outputs.upToDateWhen{ false }
}

//built alongside FactoryScope and loaded next to it; never released
tasks.register("acceptanceJar", Jar){
    archiveFileName = "FactoryScopeAcceptance.jar"
    from sourceSets.acceptance.output
    from("acceptance"){
        include "mod.hjson"
    }
}

//The acceptance harness lives in this repository, so "no test code in the release" has to be checked
//rather than assumed. Runs over whichever artifacts have been built.
tasks.register("verifyArtifacts"){
    group = "verification"
    description = "Checks the built jars carry only production code and the expected metadata."
    dependsOn "jar"

    def projectName = project.name
    def libs = layout.buildDirectory.dir("libs")

    doLast{
        def required = ["mod.hjson", "bundles/bundle.properties", "bundles/bundle_pt_BR.properties"]
        def forbidden = ~/^(mindustry|arc|org|com|kotlin|javax)\/|acceptance|Test|fixture|harness|scratch/

        ["${projectName}Desktop.jar", "${projectName}.jar"].each{ name ->
            def jar = libs.get().file(name).asFile
            if(!jar.exists()) return

            def entries = new java.util.zip.ZipFile(jar).withCloseable{ zip ->
                zip.entries().collect{ it.name }
            }

            required.each{ entry ->
                if(!entries.contains(entry)) throw new GradleException("$name is missing $entry")
            }

            def duplicates = entries.countBy{ it }.findAll{ it.value > 1 }.keySet()
            if(duplicates) throw new GradleException("$name has duplicate entries: $duplicates")

            def offenders = entries.findAll{ (it.endsWith(".class") || it.endsWith(".dex")) && it =~ forbidden }
            if(offenders) throw new GradleException("$name carries non-production code: $offenders")

            def strays = entries.findAll{ it.endsWith(".class") && !it.startsWith("factoryscope/") }
            if(strays) throw new GradleException("$name carries classes outside factoryscope/: $strays")

            if(name == "${projectName}.jar" && !entries.contains("classes.dex")){
                throw new GradleException("$name is the universal artifact but has no classes.dex")
            }

            logger.lifecycle("verified $name (${entries.size()} entries)")
        }
    }
}

tasks.register("acceptanceTest", Exec){
    group = "verification"
    description = "Runs the inspector acceptance suite in a real Mindustry client."
    dependsOn "jar", "acceptanceJar"

    doFirst{
        if(!isWindows){
            throw new GradleException("The acceptance suite launches a locally installed Mindustry and is "
                + "currently scripted for Windows only. See docs/testing.md.")
        }
    }

    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass",
        "-File", file("scripts/acceptance-test.ps1").absolutePath, "-SkipBuild"
}

jar{
    archiveFileName = "${project.name}Desktop.jar"

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register("jarAndroid"){
    dependsOn "jar"
    def projectName = project.name

    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }
        if(!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")
        def d8 = isWindows ? "d8.bat" : "d8"

        def dexing = "$d8 $dependencies --min-api 21 --output ${projectName}Android.jar ${projectName}Desktop.jar"
            .execute(null, new File("build/libs"))
        dexing.waitForProcessOutput(System.out, System.err)
        //the template ignores this, which turns a dexing failure into a confusing error in deploy
        if(dexing.exitValue() != 0) throw new GradleException("d8 failed with exit code ${dexing.exitValue()}")
    }
}

//universal desktop + android artifact; this, not the desktop jar, is what gets released
tasks.register("deploy", Jar){
    def projectName = project.name
    dependsOn "jarAndroid"
    dependsOn "jar"
    archiveFileName = "${projectName}.jar"

    //both jars carry mod.hjson and the bundles; the desktop copy wins
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from{ [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast{
        delete{ delete "build/libs/${projectName}Android.jar" }
    }
}
