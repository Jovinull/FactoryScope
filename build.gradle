apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]
sourceSets.test.java.srcDirs = ["test"]

tasks.withType(JavaCompile).configureEach{
    options.encoding = "UTF-8"
}

//The acceptance harness is a second Mindustry mod that drives the inspector inside a real client.
//Keeping it in its own source set is what guarantees it can never reach the release artifact, which is
//built from sourceSets.main alone.
sourceSets{
    acceptance{
        java.srcDirs = ["acceptance/src"]
        compileClasspath += sourceSets.main.output
    }
    // The real-client launcher is build tooling, not mod code; keeping it in a separate source set
    // makes it impossible for launcher classes to enter either production artifact.
    acceptanceLauncher{
        java.srcDirs = ["tools/acceptance/src"]
    }
    launcherTest{
        java.srcDirs = ["tools/acceptance/test"]
        compileClasspath += sourceSets.acceptanceLauncher.output
        runtimeClasspath += sourceSets.acceptanceLauncher.output
    }
}

ext{
    //pinned stable Mindustry release; the game API is not stable across major builds, so avoid "latest"/"be" here
    mindustryVersion = "v160.5"
    junitVersion = "5.11.4"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
}

// Keep SDK discovery and command arguments explicit so paths with spaces are never reparsed as a shell string.
def androidSdkRoot = { Map environment ->
    def configured = environment.get("ANDROID_HOME")?.trim()
    if(!configured) configured = environment.get("ANDROID_SDK_ROOT")?.trim()
    configured ? new File(configured).absoluteFile : null
}

def requireAndroidSdk = { Map environment ->
    File sdk = androidSdkRoot(environment)
    if(sdk == null) throw new GradleException("Android SDK not configured. Set ANDROID_HOME or ANDROID_SDK_ROOT.")
    if(!sdk.isDirectory()) throw new GradleException("Android SDK directory does not exist: ${sdk}")
    sdk
}

def buildToolsVersion = { File directory ->
    def matcher = directory.name =~ /^(\d+(?:\.\d+){1,3})$/
    if(!matcher.matches()) return null
    matcher.group(1).tokenize(".").collect{ Integer.parseInt(it) }
}

def compareBuildTools = { File left, File right ->
    List<Integer> a = buildToolsVersion(left), b = buildToolsVersion(right)
    int parts = Math.max(a.size(), b.size())
    for(int i = 0; i < parts; i++){
        int difference = Integer.compare(i < a.size() ? a[i] : 0, i < b.size() ? b[i] : 0)
        if(difference != 0) return difference
    }
    0
}

def findAndroidBuildTools = { File sdk, boolean windows ->
    File root = new File(sdk, "build-tools")
    List<File> versions = root.isDirectory()
        ? (root.listFiles() ?: [] as File[]).findAll{ it.isDirectory() && buildToolsVersion(it) != null }
            .sort{ File a, File b -> compareBuildTools(a, b) }
        : []
    if(versions.isEmpty()) throw new GradleException("No Android build-tools installation found under ${root}")

    String executableName = windows ? "d8.bat" : "d8"
    File selected = versions.reverse().find{ version ->
        File executable = new File(version, executableName)
        executable.isFile() && (windows || executable.canExecute())
    }
    if(selected == null) throw new GradleException("d8 executable not found in Android build-tools under ${root}")
    File executable = new File(selected, executableName)
    logger.lifecycle("Using Android D8 ${selected.name} from ${executable}")
    executable
}

def findAndroidPlatform = { File sdk ->
    File root = new File(sdk, "platforms")
    def platforms = root.isDirectory() ? (root.listFiles() ?: [] as File[]) : []
    platforms = platforms.findAll{ File directory ->
        directory.isDirectory() && (directory.name =~ /^android-\d+$/).matches()
            && new File(directory, "android.jar").isFile()
    }
    platforms.sort{ File a, File b ->
        Integer.parseInt(a.name.substring("android-".length())) <=> Integer.parseInt(b.name.substring("android-".length()))
    }
    if(platforms.isEmpty()) throw new GradleException("No Android platform with android.jar found under ${root}")
    platforms.last()
}

def d8Arguments = { Collection<File> classpath, File androidLibrary, File outputJar, File inputJar ->
    List<String> arguments = []
    classpath.each{ File entry -> arguments.addAll(["--classpath", entry.absolutePath]) }
    arguments.addAll(["--lib", androidLibrary.absolutePath])
    arguments.addAll(["--min-api", "21", "--output", outputJar.absolutePath, inputJar.absolutePath])
    arguments
}

def invokeD8 = { File executable, List<String> arguments, File workingDirectory ->
    try{
        List<String> command = [executable.absolutePath] + arguments
        if(isWindows){
            String quotedCommand = command.collect{ String argument ->
                "\"${argument.replace('"', '""')}\""
            }.join(" ")
            String commandShell = System.getenv("ComSpec") ?: "cmd.exe"
            String commandForCmd = "\"${quotedCommand}\"".toString()
            command = [commandShell, "/d", "/s", "/c", commandForCmd]
        }

        Process process = new ProcessBuilder(command)
            .directory(workingDirectory)
            .redirectErrorStream(true)
            .start()
        String processOutput = new String(process.getInputStream().readAllBytes(), java.nio.charset.StandardCharsets.UTF_8).trim()
        int exitCode = process.waitFor()
        if(exitCode != 0){
            String detail = processOutput ? ":\n${processOutput}" : " (no diagnostic output)"
            throw new GradleException("D8 exited with code ${exitCode}${detail}")
        }
    }catch(InterruptedException e){
        Thread.currentThread().interrupt()
        throw new GradleException("Interrupted while running D8 at ${executable}", e)
    }catch(IOException e){
        throw new GradleException("Could not start D8 executable ${executable}: ${e.message}", e)
    }catch(Exception e){
        if(e instanceof GradleException) throw e
        throw new GradleException("D8 failed while running ${executable}", e)
    }
}

repositories{
    mavenCentral()

    //Mindustry publishes a fat "dependencies.jar" on every release; this ivy layout pulls that file directly.
    //It is the approach used by the official mod template and is more reliable than jitpack.
    ivy{
        url = "https://github.com/"
        patternLayout{
            artifact("/[organisation]/[module]/releases/download/[revision]/dependencies.jar")
        }
        metadataSources{ artifact() }
        content{ includeVersion("Anuken", "Mindustry", mindustryVersion) }
    }

    //the same release also ships the game assets; the headless integration tests need them to boot
    ivy{
        url = "https://github.com/"
        patternLayout{
            artifact("/Anuken/Mindustry/releases/download/[revision]/assets.jar")
        }
        metadataSources{ artifact() }
        content{ includeModule("Anuken", "MindustryAssets") }
    }
}

java{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations{
    //game assets, needed only by the headless integration tests
    mindustryAssets
}

dependencies{
    //compileOnly: the game already provides Mindustry and Arc at runtime, they must never be bundled into the mod jar
    compileOnly "Anuken:Mindustry:$mindustryVersion"

    acceptanceCompileOnly "Anuken:Mindustry:$mindustryVersion"

    testImplementation "Anuken:Mindustry:$mindustryVersion"
    mindustryAssets "Anuken:MindustryAssets:$mindustryVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    launcherTestImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    launcherTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

//Mindustry resolves its internal files from the classpath root, but the release archive nests them under
//"assets/", so the archive is unpacked and that inner folder is what goes on the test classpath.
def mindustryAssetsDir = layout.buildDirectory.dir("mindustry-assets")

tasks.register("extractMindustryAssets", Copy){
    from{ zipTree(configurations.mindustryAssets.singleFile) }
    into mindustryAssetsDir
    //sprites, sounds and music are never touched in headless mode and make up most of the archive
    exclude "assets/sprites/**", "assets/sounds/**", "assets/music/**"
}

tasks.named("test"){
    dependsOn "extractMindustryAssets"
    classpath += files(mindustryAssetsDir.map{ it.dir("assets") })
    //the benchmark is a measurement, not a check; it would only make an ordinary test run slower
    useJUnitPlatform{ excludeTags "area-benchmark", "network-benchmark", "trace-benchmark", "trace-skipped-benchmark", "power-benchmark", "liquid-benchmark" }
    testLogging{
        events = ["failed"]
        exceptionFormat = "full"
    }
}

//prints what an area analysis costs at several sizes; see docs/testing.md
tasks.register("areaBenchmark", Test){
    group = "verification"
    description = "Measures the cost of area analysis at 50, 250, 1000 and 4000 buildings."
    dependsOn "extractMindustryAssets"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(mindustryAssetsDir.map{ it.dir("assets") })
    useJUnitPlatform{ includeTags "area-benchmark" }
    //the measurements are the whole point of the task, so they go to the console rather than a report
    testLogging{
        showStandardStreams = true
        events = ["failed", "standard_out"]
        exceptionFormat = "full"
    }
    outputs.upToDateWhen{ false }
}

