//The acceptance harness lives in this repository, so "no test code in the release" has to be checked
//rather than assumed. Runs over whichever artifacts have been built.
tasks.register("verifyArtifacts"){
    group = "verification"
    description = "Checks the built jars carry only production code and the expected metadata."
    dependsOn "jar"

    def projectName = project.name
    def libs = layout.buildDirectory.dir("libs")

    doLast{
        def required = ["mod.hjson", "icon.png", "bundles/bundle.properties", "bundles/bundle_pt_BR.properties",
            "bundles/bundle_ru.properties", "bundles/bundle_zh_CN.properties", "bundles/bundle_ko.properties",
            "bundles/bundle_es.properties"]
        def forbidden = ~/^(mindustry|arc|org|com|kotlin|javax)\/|acceptance|Test|fixture|harness|scratch|factoryscope\/tools\//

        ["${projectName}Desktop.jar", "${projectName}.jar"].each{ name ->
            def jar = libs.get().file(name).asFile
            if(!jar.exists()) return

            def entries = new java.util.zip.ZipFile(jar).withCloseable{ zip ->
                zip.entries().collect{ it.name }
            }

            required.each{ entry ->
                if(!entries.contains(entry)) throw new GradleException("$name is missing $entry")
            }

            def duplicates = entries.countBy{ it }.findAll{ it.value > 1 }.keySet()
            if(duplicates) throw new GradleException("$name has duplicate entries: $duplicates")

            def offenders = entries.findAll{ (it.endsWith(".class") || it.endsWith(".dex")) && it =~ forbidden }
            if(offenders) throw new GradleException("$name carries non-production code: $offenders")

            def strays = entries.findAll{ it.endsWith(".class") && !it.startsWith("factoryscope/") }
            if(strays) throw new GradleException("$name carries classes outside factoryscope/: $strays")

            if(name == "${projectName}.jar" && !entries.contains("classes.dex")){
                throw new GradleException("$name is the universal artifact but has no classes.dex")
            }

            logger.lifecycle("verified $name (${entries.size()} entries)")
        }
    }
}

tasks.register("acceptanceTest", JavaExec){
    group = "verification"
    description = "Runs the inspector acceptance suite in an isolated real Mindustry client."
    dependsOn "acceptanceJar"
    if(!project.hasProperty("modJar")) dependsOn "jar"
    classpath = sourceSets.acceptanceLauncher.runtimeClasspath
    mainClass = "factoryscope.tools.AcceptanceLauncher"

    doFirst{
        def arguments = ["--project", projectDir.absolutePath]
        if(project.hasProperty("mindustryPath")) arguments += ["--mindustry-path", project.property("mindustryPath").toString()]
        if(project.hasProperty("mindustryJar")) arguments += ["--mindustry-jar", project.property("mindustryJar").toString()]
        if(project.hasProperty("modJar")) arguments += ["--mod-jar", project.property("modJar").toString()]
        if(project.hasProperty("harnessJar")) arguments += ["--harness-jar", project.property("harnessJar").toString()]
        if(project.hasProperty("locale")) arguments += ["--locale", project.property("locale").toString()]
        if(project.hasProperty("capture")) arguments += ["--capture", project.property("capture").toString()]
        if(project.hasProperty("keepSandbox")) arguments += ["--keep-sandbox", project.property("keepSandbox").toString()]
        if(project.hasProperty("timeoutSeconds")) arguments += ["--timeout-seconds", project.property("timeoutSeconds").toString()]
        if(project.hasProperty("powerFixtureRepetitions")) arguments += ["--power-fixture-repetitions", project.property("powerFixtureRepetitions").toString()]
        setArgs(arguments)
    }
}

jar{
    archiveFileName = "${project.name}Desktop.jar"

    from(projectDir){
        include "mod.hjson"
        include "icon.png"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register("jarAndroid"){
    dependsOn "jar"
    def projectName = project.name

    doLast{
        File sdk = requireAndroidSdk(System.getenv())
        File d8 = findAndroidBuildTools(sdk, isWindows)
        File platform = findAndroidPlatform(sdk)
        File libs = layout.buildDirectory.dir("libs").get().asFile
        if(!libs.isDirectory() && !libs.mkdirs()) throw new GradleException("Could not create artifact directory: ${libs}")

        List<File> classpath = (configurations.compileClasspath.files + configurations.runtimeClasspath.files)
            .collect{ it.absoluteFile }.unique()
        File androidLibrary = new File(platform, "android.jar").absoluteFile
        File output = new File(libs, "${projectName}Android.jar")
        File input = new File(libs, "${projectName}Desktop.jar")
        List<String> arguments = d8Arguments(classpath, androidLibrary, output, input)

        invokeD8(d8, arguments, libs)
    }
}

tasks.register("d8ToolingTest"){
    group = "verification"
    description = "Tests Android SDK/D8 discovery and argument construction without requiring the Android SDK."
    doLast{
        def require = { boolean condition, String message ->
            if(!condition) throw new GradleException("D8 tooling test failed: ${message}")
        }
        def expectFailure = { String expected, Closure action ->
            try{
                action.call()
            }catch(GradleException failure){
                if(failure.message.contains(expected)) return
                throw new GradleException("Expected '${expected}', got '${failure.message}'", failure)
            }
            throw new GradleException("Expected D8 tooling failure containing '${expected}'")
        }

        File temp = java.nio.file.Files.createTempDirectory("FactoryScope build tooling ").toFile()
        try{
            File sdk = new File(temp, "Android SDK with spaces")
            File oldTools = new File(sdk, "build-tools/34.0.0")
            File latestTools = new File(sdk, "build-tools/35.0.0")
            File malformedTools = new File(sdk, "build-tools/35.latest")
            File olderPlatform = new File(sdk, "platforms/android-34")
            File latestPlatform = new File(sdk, "platforms/android-35")
            [oldTools, latestTools, malformedTools, olderPlatform, latestPlatform].each{ it.mkdirs() }
            [oldTools, latestTools].each{ directory ->
                new File(directory, "d8").createNewFile()
                new File(directory, "d8.bat").createNewFile()
            }
            new File(olderPlatform, "android.jar").createNewFile()
            new File(latestPlatform, "android.jar").createNewFile()
            [oldTools, latestTools].each{ directory -> new File(directory, "d8").setExecutable(true) }

            require(androidSdkRoot([ANDROID_HOME: sdk.absolutePath, ANDROID_SDK_ROOT: temp.absolutePath]) == sdk.absoluteFile,
                "ANDROID_HOME must take precedence when both SDK variables are set")
            require(androidSdkRoot([ANDROID_SDK_ROOT: sdk.absolutePath]) == sdk.absoluteFile,
                "ANDROID_SDK_ROOT fallback")
            expectFailure("Android SDK not configured"){ requireAndroidSdk([:]) }
            expectFailure("No Android build-tools installation found"){
                findAndroidBuildTools(new File(temp, "no build tools"), isWindows)
            }

            File selectedD8 = findAndroidBuildTools(sdk, false)
            require(selectedD8.name == "d8" && selectedD8.parentFile.name == "35.0.0",
                "select numerically newest Unix build-tools executable")
            File selectedWindowsD8 = findAndroidBuildTools(sdk, true)
            require(selectedWindowsD8.name == "d8.bat" && selectedWindowsD8.parentFile.name == "35.0.0",
                "select numerically newest Windows build-tools executable")
            require(findAndroidPlatform(sdk).name == "android-35", "select numerically newest platform with android.jar")

            File missingD8Sdk = new File(temp, "SDK with missing D8")
            new File(missingD8Sdk, "build-tools/36.0.0").mkdirs()
            expectFailure("d8 executable not found") { findAndroidBuildTools(missingD8Sdk, isWindows) }

            File projectWithSpaces = new File(temp, "project path with spaces")
            projectWithSpaces.mkdirs()
            File dependencyWithSpaces = new File(temp, "dependency path with spaces/dependency.jar")
            File androidLibraryWithSpaces = new File(sdk, "platforms/android-35/android.jar")
            File outputWithSpaces = new File(projectWithSpaces, "build/libs/FactoryScope Android.jar")
            File inputWithSpaces = new File(projectWithSpaces, "build/libs/FactoryScope Desktop.jar")
            List<String> arguments = d8Arguments([dependencyWithSpaces], androidLibraryWithSpaces, outputWithSpaces, inputWithSpaces)
            require(arguments == ["--classpath", dependencyWithSpaces.absolutePath, "--lib", androidLibraryWithSpaces.absolutePath, "--min-api", "21",
                "--output", outputWithSpaces.absolutePath, inputWithSpaces.absolutePath],
                "dependency classpath, android library, project, and output paths with spaces remain individual arguments")

            File fakeExecutable = new File(latestTools, isWindows ? "d8.bat" : "d8")
            File invocationMarker = new File(temp, "D8 invocation with spaces.txt")
            if(isWindows){
                fakeExecutable.text = "@echo off\r\necho invoked > \"${invocationMarker.absolutePath}\"\r\nexit /b 0\r\n"
            }else{
                fakeExecutable.text = "#!/bin/sh\nprintf invoked > '${invocationMarker.absolutePath}'\n"
                fakeExecutable.setExecutable(true)
            }
            invokeD8(fakeExecutable, arguments, projectWithSpaces)
            require(invocationMarker.isFile(), "invoke the SDK executable from a path with spaces")
            if(isWindows){
                fakeExecutable.text = "@echo off\r\necho synthetic D8 diagnostic 1>&2\r\nexit /b 7\r\n"
            }else{
                fakeExecutable.text = "#!/bin/sh\nprintf 'synthetic D8 diagnostic\\n' >&2\nexit 7\n"
                fakeExecutable.setExecutable(true)
            }
            expectFailure("synthetic D8 diagnostic"){ invokeD8(fakeExecutable, arguments, projectWithSpaces) }
            logger.lifecycle("D8 tooling checks passed (SDK precedence, version selection, missing-tool errors, spaced paths)")
        }finally{
            delete(temp)
        }
    }
}

//universal desktop + android artifact; this, not the desktop jar, is what gets released
tasks.register("deploy", Jar){
    def projectName = project.name
    dependsOn "jarAndroid"
    dependsOn "jar"
    archiveFileName = "${projectName}.jar"

    //both jars carry mod.hjson and the bundles; the desktop copy wins
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from{ [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast{
        delete{ delete "build/libs/${projectName}Android.jar" }
    }
}
