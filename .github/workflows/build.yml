name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PATH
        run: ls -d "$ANDROID_HOME"/build-tools/* | tail -1 >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew test deploy

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: FactoryScope
          path: build/libs/FactoryScope.jar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
