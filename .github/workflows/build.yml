name: Build

on: [push, pull_request]

jobs:
  launcher-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test launcher portability (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew acceptanceLauncherTest d8ToolingTest

      - name: Test launcher portability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat acceptanceLauncherTest d8ToolingTest

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew test

      # the acceptance harness cannot run here (it needs a real client), but it must still compile
      - name: Compile the acceptance harness
        run: ./gradlew acceptanceJar

      # the universal jar is the release artifact; the desktop jar alone will not load on Android
      - name: Build the universal jar
        run: ./gradlew deploy

      - name: Verify the artifacts
        run: ./gradlew verifyArtifacts

      - name: Report the artifact contents
        run: unzip -l build/libs/FactoryScope.jar

      - name: Upload the universal jar
        uses: actions/upload-artifact@v5
        with:
          name: FactoryScope
          path: build/libs/FactoryScope.jar

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests/test
