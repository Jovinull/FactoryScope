name: Feature request
description: Something FactoryScope should show or help you find out.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FactoryScope only reads the game: it never changes your factory, and it reports evidence instead of
        guessing causes. Ideas that fit that are the easiest to take on.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to find out about your factory?
      placeholder: "Why my plastanium line keeps stopping, ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What FactoryScope could show, and where.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you find it out today
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, sketches or a save file
