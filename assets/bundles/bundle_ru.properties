factoryscope.power.generators = Видимые генераторы
factoryscope.power.consumers = Видимые потребители
factoryscope.power.batteries = Видимые аккумуляторы
factoryscope.power.generator-list = Сведения о видимых генераторах
factoryscope.power.consumer-list = Сведения о видимых потребителях
factoryscope.power.battery-list = Сведения о видимых аккумуляторах
factoryscope.power.inspect = Осмотреть здание
factoryscope.power.metrics-unavailable = Показатели энергии недоступны при читерском энергоснабжении, если видна не вся сеть, после ошибки чтения движка или если движок вернул не конечное значение.
factoryscope.power.battery-reserves = Генерация ниже текущей потребности; в аккумуляторах также есть запас энергии. Этот экран не приписывает конкретный вклад.
factoryscope.power.generator-problems = У генераторов, подключённых к сети и видимых сейчас, проблемы с производством: {0}.
factoryscope.power.generator-summary = Работают: {0}; отключены или неработоспособны: {1}; с проблемами производства: {2}; без классификации: {3}.
factoryscope.power.diodes = Соединения силовых диодов
factoryscope.power.diode-link = {0}: сеть {1} → сеть {2}
factoryscope.power.diode-unmeasured = Условная передача с тыльной стороны на лицевую; текущая активность и объём не отображаются. Сети остаются раздельными.
factoryscope.power.diode-scope = Соединения через силовые диоды показываются только если сам диод попал в выборку; остальные не ищутся. Показатели всей сети могут учитывать передачу через не показанный диод.
factoryscope.power.diode-capacity-unavailable = Безопасно определить ёмкость аккумуляторов нельзя: как минимум одна сеть на конце неполна или недоступна; передача не утверждается.
factoryscope.power.state.cheatPowered = Энергия по правилу читов
factoryscope.power.state.unavailable = Показатели недоступны
factoryscope.power.state.noCurrentDemand = Текущей потребности нет
factoryscope.power.state.underpowered = Недостаток энергии
factoryscope.power.state.noGeneration = Генерации нет
factoryscope.power.state.generationBelowDemand = Генерация ниже текущей потребности
factoryscope.power.state.surplus = Генерация выше текущей потребности
factoryscope.power.state.balanced = Генерация покрывает текущую потребность
factoryscope.label.buffered-power = Внутренний буфер энергии
factoryscope.power.visibility-incomplete = Некоторые участники игрового графа не удалось безопасно осмотреть. Сводные показатели скрыты, чтобы не раскрывать информацию.
factoryscope.power.view-world = Показать соединения
factoryscope.power.viewing = Электрические соединения — направление потока энергии не показано
factoryscope.power.diode-no-batteries = Как минимум в одной конечной сети нет активной ёмкости аккумуляторов; по обычным правилам Mindustry этот диод не передаёт запасённую энергию.
