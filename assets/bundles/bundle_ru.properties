factoryscope.diagnosis.active.normal = FactoryScope не обнаружил проверяемых факторов, ограничивающих эту фабрику.
factoryscope.diagnosis.inoperable-here.stopped = Игра отключила это здание, потому что оно не может работать здесь: оно находится за пределами игровой области, условия среды ему не подходят или его команда неактивна.
factoryscope.diagnosis.disabled.stopped = Здание отключено игроком или процессором логики. Пока оно отключено, остальные проверки не выполняются.
factoryscope.diagnosis.output-blocked.stopped = Производство остановлено: выход нельзя освободить — {0}. Освободите выход, и фабрика снова заработает.
factoryscope.diagnosis.not-consuming.stopped = Сейчас здание не забирает входные ресурсы. Для этого типа блока у FactoryScope нет модели производства, поэтому он не может определить, нормально ли это.
factoryscope.diagnosis.missing-item-input.stopped = Производство остановлено из-за нехватки {0}.
factoryscope.diagnosis.missing-item-input.reduced = Ресурс {0} доступен лишь частично и ограничивает производство.
factoryscope.diagnosis.missing-liquid-input.stopped = Производство остановлено из-за нехватки {0}.
factoryscope.diagnosis.missing-liquid-input.reduced = {0} поступает медленнее, чем потребляется фабрикой, что ограничивает эффективность.
factoryscope.diagnosis.insufficient-power.stopped = Энергосеть не передаёт этому зданию энергию.
factoryscope.diagnosis.insufficient-power.reduced = Материалы есть, но энергосеть не полностью покрывает текущую потребность.
factoryscope.diagnosis.other-consumer-limited.stopped = Не выполнено требование, которое FactoryScope не моделирует: {0}.
factoryscope.diagnosis.other-consumer-limited.reduced = Требование, которое FactoryScope не моделирует, ограничивает производство: {0}.
factoryscope.diagnosis.block-condition-limited.stopped = Условие, зависящее от блока, например температура или поверхность под ним, снизило эффективность до нуля.
factoryscope.diagnosis.block-condition-limited.reduced = Условие, зависящее от блока, например температура или поверхность под ним, ограничивает эффективность.
factoryscope.diagnosis.halted-unknown-cause.stopped = Здание не производит, и FactoryScope не может связать это с распознаваемым входным ресурсом.
factoryscope.diagnosis.halted-unknown-cause.reduced = Здание работает не на полной эффективности, и FactoryScope не может связать это с распознаваемым входным ресурсом.
factoryscope.diagnosis.limited-support.normal = У FactoryScope нет модели производства для этого блока, поэтому показана только общая информация.
factoryscope.diagnosis.uncertain = Вероятно: {0}

