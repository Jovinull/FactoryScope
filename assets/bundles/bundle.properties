mod.factory-scope.description = Diagnose factory efficiency, inputs, outputs and production problems directly in Mindustry.

factoryscope.inspect.tooltip = FactoryScope: inspect a factory
factoryscope.inspect.hint = Select a production block to diagnose. Select anywhere else to cancel.
factoryscope.inspect.not-visible = That building is not visible to you.

