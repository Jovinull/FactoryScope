factoryscope.diagnosis.active.normal = Nothing FactoryScope can check is holding this factory back.
factoryscope.diagnosis.inoperable-here.stopped = The game has switched this building off because it cannot run where it stands: it is outside the playable area, the environment does not support it, or its team is inactive.
factoryscope.diagnosis.disabled.stopped = The building is switched off, either by a player or by a logic processor. Nothing else is evaluated while it is disabled.
factoryscope.diagnosis.output-blocked.stopped = Production has stopped because the output cannot be evacuated: {0}. Free up the output and the factory restarts on its own.
factoryscope.diagnosis.not-consuming.stopped = This building is not drawing its inputs right now. FactoryScope has no production model for this block type, so it cannot tell you whether that is normal.
factoryscope.diagnosis.missing-item-input.stopped = Production has stopped for want of {0}.
factoryscope.diagnosis.missing-item-input.reduced = {0} is only partly available and is holding production back.
factoryscope.diagnosis.missing-liquid-input.stopped = Production has stopped for want of {0}.
factoryscope.diagnosis.missing-liquid-input.reduced = {0} is arriving more slowly than the factory consumes it, which caps efficiency.
factoryscope.diagnosis.insufficient-power.stopped = The power grid is delivering nothing to this building.
factoryscope.diagnosis.insufficient-power.reduced = The material inputs are present, but the power grid is not fully covering demand.
factoryscope.diagnosis.other-consumer-limited.stopped = A requirement FactoryScope does not model is unmet: {0}.
factoryscope.diagnosis.other-consumer-limited.reduced = A requirement FactoryScope does not model is limiting production: {0}.
factoryscope.diagnosis.block-condition-limited.stopped = A condition specific to this block, such as heat or the terrain underneath it, has reduced its efficiency to zero.
factoryscope.diagnosis.block-condition-limited.reduced = A condition specific to this block, such as heat or the terrain underneath it, is capping its efficiency.
factoryscope.diagnosis.halted-unknown-cause.stopped = The building is not producing and FactoryScope cannot attribute that to any input it recognises.
factoryscope.diagnosis.halted-unknown-cause.reduced = The building is running below full efficiency and FactoryScope cannot attribute that to any input it recognises.
factoryscope.diagnosis.limited-support.normal = FactoryScope has no production model for this block, so only general information is shown.
factoryscope.diagnosis.uncertain = Probably: {0}

