factoryscope.diagnosis.active.normal = Nada que o FactoryScope consiga verificar está limitando esta fábrica.
factoryscope.diagnosis.inoperable-here.stopped = O jogo desligou este edifício porque ele não pode funcionar onde está: fica fora da área jogável, o ambiente não o suporta ou a equipe dele está inativa.
factoryscope.diagnosis.disabled.stopped = O edifício está desligado, seja por um jogador ou por um processador lógico. Nada mais é avaliado enquanto ele estiver desativado.
factoryscope.diagnosis.output-blocked.stopped = A produção parou porque a saída não consegue ser escoada: {0}. Libere a saída e a fábrica volta a funcionar sozinha.
factoryscope.diagnosis.not-consuming.stopped = Este edifício não está puxando suas entradas no momento. O FactoryScope não tem um modelo de produção para este tipo de bloco, então não sabe dizer se isso é normal.
factoryscope.diagnosis.missing-item-input.stopped = A produção parou por falta de {0}.
factoryscope.diagnosis.missing-item-input.reduced = {0} está disponível apenas em parte e está segurando a produção.
factoryscope.diagnosis.missing-liquid-input.stopped = A produção parou por falta de {0}.
factoryscope.diagnosis.missing-liquid-input.reduced = {0} chega mais devagar do que a fábrica consome, o que limita a eficiência.
factoryscope.diagnosis.insufficient-power.stopped = A rede de energia não está entregando nada a este edifício.
factoryscope.diagnosis.insufficient-power.reduced = Os materiais estão presentes, mas a rede de energia não cobre toda a demanda.
factoryscope.diagnosis.other-consumer-limited.stopped = Um requisito que o FactoryScope não conhece não está atendido: {0}.
factoryscope.diagnosis.other-consumer-limited.reduced = Um requisito que o FactoryScope não conhece está limitando a produção: {0}.
factoryscope.diagnosis.block-condition-limited.stopped = Uma condição específica deste bloco, como calor ou o terreno abaixo dele, zerou a eficiência.
factoryscope.diagnosis.block-condition-limited.reduced = Uma condição específica deste bloco, como calor ou o terreno abaixo dele, está limitando a eficiência.
factoryscope.diagnosis.halted-unknown-cause.stopped = O edifício não está produzindo e o FactoryScope não consegue atribuir isso a nenhuma entrada que reconheça.
factoryscope.diagnosis.halted-unknown-cause.reduced = O edifício está abaixo da eficiência máxima e o FactoryScope não consegue atribuir isso a nenhuma entrada que reconheça.
factoryscope.diagnosis.limited-support.normal = O FactoryScope não tem um modelo de produção para este bloco, então apenas informações gerais são exibidas.
factoryscope.diagnosis.uncertain = Provavelmente: {0}

