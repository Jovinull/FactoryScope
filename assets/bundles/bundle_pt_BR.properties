factoryscope.panel.optional-note = Entradas opcionais aumentam a eficiência, mas nunca param a produção.
factoryscope.panel.unknown-consumer = O FactoryScope não reconhece este requisito.
factoryscope.panel.limited-support = Há diagnóstico limitado para este bloco. O FactoryScope modela integralmente os blocos de produção convencionais.
factoryscope.panel.consumers-bypassed = As regras da equipe permitem que os blocos funcionem sem energia ou recursos, então o jogo ignora completamente os requisitos de entrada.
factoryscope.panel.buffered-power = Este edifício carrega uma reserva interna de energia.
factoryscope.panel.target-lost = Este edifício não existe mais.
factoryscope.panel.analysis-failed = O FactoryScope não conseguiu analisar este edifício. Veja o registro para detalhes.
